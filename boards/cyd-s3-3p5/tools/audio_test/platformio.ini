; Speaker alert test for the 3.5" ESP32-S3 board (ES8311 codec). Modelled on ../rangetest/platformio.ini.
; NOT flashed/run: everything is unverified on hardware.
; Stock "espressif32" here resolves to Arduino-ESP32 2.0.17 (IDF 4.4) which has no driver/i2s_std.h,
; so this uses the pioarduino platform (Arduino-ESP32 3.x / IDF 5.x), matching the vendor firmware (IDF 5.4.1).
[env:s3-audio-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
